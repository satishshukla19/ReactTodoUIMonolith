trigger:
  branches:
    include:
      - develop
      - release
      - main     # Fixed: Changed from main/*

pool:
  name: 'Default'

pr:
  branches:
    include:
      - develop
      - main

variables:
  - name: NODE_VERSION
    value: '20.x'
  - name: BUILD_OUTPUT_PATH
    value: '$(System.DefaultWorkingDirectory)/build'
  - name: PACKAGE_VERSION
    value: '1.0.$(Build.BuildId)'

stages:
# ========================================================
# STAGE 1: BUILD & DEVSECOPS SECURITY SCANNING
# ========================================================
- stage: BuildAndSecurityScan
  displayName: 'Build & DevSecOps Security Scan'
  jobs:
  - job: SecurityAndBuild
    displayName: 'Compile, Audit & Scan React App'

    steps:
    # 1. Setup Node.js
    - task: NodeTool@1
      inputs:
        versionSpec: '$(NODE_VERSION)'
      displayName: 'Install Node.js'

    # 2. Install & Run Secret Scanning (Gitleaks)
    - task: CmdLine@2
      displayName: 'Install Gitleaks'
      inputs:
        script: |
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.0/gitleaks_8.18.0_linux_x64.tar.gz
          tar -zxvf gitleaks_8.18.0_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

    - task: CmdLine@2
      displayName: 'Run Gitleaks'
      continueOnError: true
      inputs:
        script: 'gitleaks detect --source . --verbose'

    # 3. Dependency Audit (SCA)
    - script: |
        npm ci
        npm audit --audit-level=critical
      displayName: 'DevSecOps: SCA Dependency Audit (NPM Audit)'
      continueOnError: true

    # 4. Build React Application
    - script: |
        if [ "$(Build.SourceBranchName)" == "develop" ]; then
          export REACT_APP_API_URL="https://api-dev.yourdomain.com"
        elif [[ "$(Build.SourceBranch)" == *release* ]]; then
          export REACT_APP_API_URL="https://api-staging.yourdomain.com"
        else
          export REACT_APP_API_URL="https://api.yourdomain.com"
        fi

        # Crucial Fix: Prevent React build failure from lint warnings
        export CI=false

        npm run build
      displayName: 'Compile React Production Bundle'

    # 5. Publish Build Artifact
    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(BUILD_OUTPUT_PATH)'
        ArtifactName: 'react-frontend-app'
        publishLocation: 'Container'

