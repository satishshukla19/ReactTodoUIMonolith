trigger:
  branches:
    include:
      - develop
      - release
      - main/*
pool:
  name: 'Default'

pr:
  branches:
    include:
      - develop
      - main

variables:
  - name: NODE_VERSION
    value: '20.x'
  - name: BUILD_OUTPUT_PATH
    value: '$(System.DefaultWorkingDirectory)/build'

stages:
# ========================================================
# STAGE 1: BUILD & DEVSECOPS SECURITY SCANNING
# ========================================================
- stage: BuildAndSecurityScan
  displayName: 'Build & DevSecOps Security Scan'
  jobs:
  - job: SecurityAndBuild
    displayName: 'Compile, Audit & Scan React App'

    steps:
    # 1. Setup Node.js
    - task: NodeTool@1
      inputs:
        versionSpec: '$(NODE_VERSION)'
      displayName: 'Install Node.js'

    # 2. Secret Scanning using Gitleaks
    - task: CmdLine@2
      displayName: 'Install Gitleaks'
      # continueOnError: true
      inputs:
        script: |
          # 1. Download Gitleaks tarball
              wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.0/gitleaks_8.18.0_linux_x64.tar.gz
          
              # 2. Extract the binary
              tar -zxvf gitleaks_8.18.0_linux_x64.tar.gz
          
              # 3. Move binary to system PATH so it can be called anywhere
              sudo mv gitleaks /usr/local/bin/
          
              # 4. Give execution permissions
              sudo chmod +x /usr/local/bin/gitleaks
          
              # 5. Verify installation
              gitleaks version

    - task: CmdLine@2
      displayName: 'Run Gitleaks'
      continueOnError: true
      inputs:
        script: 'gitleaks detect --source . --verbose'


    # 3. Dependency Scanning (SCA) - NPM Audit
    - script: |
        npm ci
        npm audit --audit-level=critical
      displayName: 'DevSecOps: SCA Dependency Audit (NPM Audit)'
      continueOnError: false

